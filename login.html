<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="assets/favicon1.png">
  <title>Login - Deyes Mart</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background: linear-gradient(135deg, #FFF9C4, #FFCDD2, #B2EBF2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .login-box:hover{
      transform: translateY(10px);
    }

    .login-logo {
      width: 80px;
      margin-bottom: 20px;
    }

    .login-title {
      font-size: 24px;
      color: #5D4037;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .login-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
    }

    .login-form button {
      width: 100%;
      padding: 12px;
      background-color: #5D4037;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      transition: background 0.3s ease;
    }

    .login-form button:hover {
      background: palevioletred;
    }

    .back-link {
      display: inline-block;
      margin-top: 15px;
      color: #5D4037;
      font-size: 14px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="assets/logo.png" alt="Deyes Mart Logo" class="login-logo">
    <h2 class="login-title">Login to Deyes Mart</h2>
    <form class="login-form" action="index.html" method="GET">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
